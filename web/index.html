<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消耗品ストック予測</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#4f7fff">
  <meta name="description" content="在庫を数えずに、切らさず・買いすぎずに回す消耗品ストック予測">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ストック予測">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --c-primary: #4f7fff;
      --c-soon:    #f59e0b;
      --c-overdue: #ef4444;
      --c-ok:      #22c55e;
      --c-bg:      #f8fafc;
      --c-card:    #ffffff;
      --c-border:  #e2e8f0;
      --c-text:    #1e293b;
      --c-muted:   #64748b;
      --radius:    12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--c-primary);
      color: #fff;
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    header h1 img { width: 28px; height: 28px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    #btn-add {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      background: #fff;
      border-bottom: 1px solid var(--c-border);
    }
    .nav-tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--c-muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 3px solid transparent;
    }
    .nav-tab.active {
      color: var(--c-primary);
      border-bottom-color: var(--c-primary);
      font-weight: 600;
    }

    /* ── Main ── */
    #main {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Card ── */
    .card {
      background: var(--c-card);
      border-radius: var(--radius);
      border-left: 4px solid var(--c-ok);
      padding: 12px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card.status-soon    { border-left-color: var(--c-soon); }
    .card.status-overdue { border-left-color: var(--c-overdue); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .item-name { font-weight: 700; font-size: 1rem; }

    .badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
    .badge-ok      { background: #dcfce7; color: #15803d; }
    .badge-soon    { background: #fef3c7; color: #92400e; }
    .badge-overdue { background: #fee2e2; color: #991b1b; }

    .card-stock {
      font-size: 1rem;
      margin-bottom: 4px;
    }
    .card-stock strong { color: var(--c-primary); }

    .card-body {
      font-size: 0.82rem;
      color: var(--c-muted);
      margin-bottom: 10px;
      min-height: 1.4em;
    }
    .runout-label { margin-right: 4px; }
    .runout { font-weight: 600; color: var(--c-text); }
    .range  { margin-left: 4px; font-size: 0.75rem; }
    .no-estimate { font-style: italic; }
    .learning-badge {
      display: inline-block;
      margin-left: 6px;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 99px;
      background: #e0e7ff;
      color: #3730a3;
    }

    /* ── Card actions ── */
    .card-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .btn-buy {
      flex: 1;
      background: var(--c-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 70px;
    }
    .btn-buy:active  { opacity: .8; }
    .btn-buy:disabled { background: #94a3b8; cursor: not-allowed; }

    .btn-open {
      flex: 1;
      background: #fff;
      color: var(--c-primary);
      border: 2px solid var(--c-primary);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 70px;
    }
    .btn-open:active   { opacity: .8; }
    .btn-open:disabled { border-color: #94a3b8; color: #94a3b8; cursor: not-allowed; }

    .btn-icon {
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--c-text);
      background: var(--c-border);
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-undo {
      font-size: 0.78rem;
      padding: 6px 10px;
      border: 1px solid var(--c-muted);
      border-radius: 8px;
      background: none;
      color: var(--c-muted);
      cursor: pointer;
      animation: fadein .2s;
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    /* ── Soon list ── */
    .soon-item {
      display: flex;
      flex-direction: row;
      font-weight: 400;
      align-items: center;
      gap: 10px;
      background: var(--c-card);
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--c-border);
      cursor: pointer;
    }
    .soon-item input { width: 18px; height: 18px; flex-shrink: 0; cursor: pointer; }
    .soon-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .soon-name { font-weight: 600; }
    .soon-stock { font-size: 0.78rem; color: var(--c-muted); }

    /* ── Forms ── */
    form { display: flex; flex-direction: column; gap: 14px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; }
    input[type="text"],
    input[type="number"],
    input[type="time"] {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--c-border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      font-weight: 400;
    }
    input:focus { border-color: var(--c-primary); }
    .req { color: var(--c-overdue); }
    .form-actions { display: flex; gap: 8px; }

    details { border: 1px solid var(--c-border); border-radius: 8px; padding: 10px 12px; }
    summary.detail-toggle {
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--c-muted);
      list-style: none;
    }
    summary.detail-toggle::before { content: "▶ "; font-size: 0.7rem; }
    details[open] summary.detail-toggle::before { content: "▼ "; }
    .detail-body { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }

    /* ── Buttons ── */
    .btn-primary {
      background: var(--c-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-ghost {
      background: none;
      border: 1px solid var(--c-border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--c-text);
    }
    .btn-danger {
      background: none;
      border: 1px solid var(--c-overdue);
      color: var(--c-overdue);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .data-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .data-actions label { font-weight: 400; flex-direction: row; align-items: center; font-size: 0.9rem; }

    .hint { font-size: 0.82rem; color: var(--c-muted); }
    .empty { text-align: center; padding: 40px 20px; color: var(--c-muted); }
    .empty p { margin-bottom: 16px; }

    hr { border: none; border-top: 1px solid var(--c-border); margin: 16px 0; }
    h3 { font-size: 0.95rem; margin-bottom: 8px; }

    /* ── Dialog ── */
    dialog {
      margin: auto;   /* 全体リセットの margin:0 で中央寄せが消えるのを戻す */
      max-height: 90dvh;
      border: none;
      border-radius: var(--radius);
      padding: 20px;
      width: min(400px, 95vw);
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .dialog-header h2 { font-size: 1rem; }
    .dialog-footer { display: flex; justify-content: flex-end; margin-top: 16px; }
    /* ── Summary / banner ── */
    .summary { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 0.8rem; padding: 5px 12px; border-radius: 99px; border: none;
      font-weight: 600; font-family: inherit; cursor: default;
    }
    button.chip { cursor: pointer; }
    .chip-overdue { background: #fee2e2; color: #991b1b; }
    .chip-soon    { background: #fef3c7; color: #92400e; }
    .chip-ok      { background: #dcfce7; color: #15803d; }
    .chip-cost    { background: #e0e7ff; color: #3730a3; }
    .banner {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
      border-radius: var(--radius); padding: 10px 12px; font-size: 0.82rem;
    }
    .btn-small { padding: 5px 10px; font-size: 0.8rem; white-space: nowrap; background: #fff; }

    /* ── Card (jar) ── */
    .card-main { display: flex; gap: 12px; align-items: flex-start; }
    .card-content { flex: 1; min-width: 0; }
    .jar { width: 40px; height: 48px; flex-shrink: 0; margin-top: 2px; }
    .item-name {
      background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer;
      text-align: left; display: flex; align-items: center; gap: 6px; min-width: 0;
    }
    .item-emoji { font-size: 1.15rem; line-height: 1; }
    .cost { margin-left: 6px; font-size: 0.75rem; color: #3730a3; }

    /* ── Emoji picker ── */
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 0.85rem; font-weight: 600; }
    .emoji-picker { display: flex; flex-wrap: wrap; gap: 4px; }
    .emoji-opt {
      min-width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--c-border);
      background: #fff; font-size: 1.2rem; cursor: pointer; padding: 0 6px;
    }
    .emoji-opt[data-emoji=""] { font-size: 0.75rem; color: var(--c-muted); }
    .emoji-opt.selected { border: 2px solid var(--c-primary); background: #eef2ff; }
    .row { display: flex; gap: 8px; }
    .row > label { flex: 1; min-width: 0; }

    /* ── Empty / settings ── */
    .empty-mascot { width: 88px; height: 88px; border-radius: 22px; margin-bottom: 12px;
                    box-shadow: 0 4px 14px rgba(79,127,255,.3); }
    .section { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .status-line { font-size: 0.85rem; }
    .status-line.warn { color: #92400e; }
    .soon-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    /* ── History ── */
    .history-stock { font-size: 0.9rem; margin-bottom: 12px; }
    .history-add {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px;
      background: var(--c-bg); border-radius: 8px; padding: 10px; margin-bottom: 12px;
    }
    .history-add label { font-size: 0.75rem; }
    .history-add .full { grid-column: 1 / -1; }
    .history-add input, .history-add select { width: 100%; min-width: 0; }
    .history-add select, .history-add input[type="datetime-local"] {
      padding: 8px 10px; border: 1px solid var(--c-border); border-radius: 8px;
      font-size: 0.9rem; background: #fff; font-family: inherit;
    }
    #history-list { list-style: none; max-height: 45vh; overflow-y: auto; }
    .history-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 2px;
      border-bottom: 1px solid var(--c-border); font-size: 0.85rem;
    }
    .history-text { flex: 1; }
    .history-text small { color: var(--c-muted); margin-left: 4px; }
    .history-date { color: var(--c-muted); font-size: 0.78rem; white-space: nowrap; }
    .btn-del { background: none; border: none; color: var(--c-muted); cursor: pointer; padding: 4px 6px; }
    .btn-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--c-muted); }
    /* ── Update notice ── */
    .app-notice {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
      background: #eef2ff; border-bottom: 1px solid #c7d2fe; color: #3730a3;
      padding: 10px 14px; font-size: 0.85rem;
    }
    .app-notice > span { align-self: center; }
    .app-notice ul { margin: 6px 0 0 1.2em; font-size: 0.8rem; }
    .btn-notice { background: var(--c-primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    .choice-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    #choice-message { font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <h1><img src="./icon-192.png" alt="">消耗品ストック予測</h1>
  <button id="btn-add">+ 追加</button>
</header>

<nav>
  <button class="nav-tab active" data-view="home">ホーム</button>
  <button class="nav-tab" data-view="soon">そろそろ</button>
  <button class="nav-tab" data-view="settings">設定</button>
</nav>

<div id="app-notice" class="app-notice" hidden></div>

<main id="main">
  <div class="empty"><p>読み込み中…</p></div>
</main>

<!-- 編集ダイアログ -->
<dialog id="edit-dialog">
  <div class="dialog-header">
    <h2>品目を編集</h2>
    <button id="btn-close-edit" class="btn-close">✕</button>
  </div>
  <form id="edit-form">
    <label>品目名
      <input type="text" id="e-name" required>
    </label>
    <div class="field">
      <span class="field-label">アイコン</span>
      <div id="e-emoji-wrap"></div>
    </div>
    <label>登録時の在庫数
      <input type="number" id="e-stock" step="0.5" min="0">
    </label>
    <p class="hint">いまの在庫を合わせたいときは「履歴」から「在庫を数え直す」を記録してください。</p>
    <label>在庫の単位
      <input type="text" id="e-unit" placeholder="個">
    </label>
    <details>
      <summary class="detail-toggle">詳細設定（空欄で解除）</summary>
      <div class="detail-body">
        <div class="row">
          <label>1つあたりの量
            <input type="number" id="e-qty" step="0.1" min="0.1">
          </label>
          <label>量の単位
            <input type="text" id="e-punit" placeholder="例: ml">
          </label>
        </div>
        <label>初期消費ペース申告（日）
          <input type="number" id="e-prior" step="1" min="1">
        </label>
        <label>単価（円・1つあたり）
          <input type="number" id="e-price" step="1" min="0">
        </label>
      </div>
    </details>
    <div class="form-actions">
      <button type="submit" class="btn-primary">保存</button>
      <button type="button" id="btn-edit-history" class="btn-ghost">📜 履歴</button>
    </div>
  </form>
  <div class="dialog-footer">
    <button id="btn-archive" class="btn-danger">アーカイブ</button>
  </div>
</dialog>

<!-- 履歴ダイアログ -->
<dialog id="history-dialog">
  <div class="dialog-header">
    <h2 id="history-title">履歴</h2>
    <button id="btn-close-history" class="btn-close">✕</button>
  </div>
  <div id="history-stock" class="history-stock"></div>
  <form id="history-form" class="history-add">
    <label>記録の種類
      <select id="h-type">
        <option value="purchase">🛒 買った</option>
        <option value="opening">📂 使用開始</option>
        <option value="adjust">🔢 在庫を数え直す</option>
      </select>
    </label>
    <label id="h-qty-label"><span>個数</span>
      <input type="number" id="h-qty" step="0.5" min="0.5" value="1">
    </label>
    <label class="full">日時
      <input type="datetime-local" id="h-at">
    </label>
    <button type="submit" class="btn-primary full">記録を追加</button>
  </form>
  <ul id="history-list"></ul>
</dialog>

<!-- 選択ダイアログ -->
<dialog id="choice-dialog">
  <h2 id="choice-title" style="font-size:1rem;margin-bottom:8px"></h2>
  <p id="choice-message"></p>
  <div class="choice-actions"></div>
</dialog>

<script src="./version.js"></script>
<script src="./db.js"></script>
<script src="./forecast.js"></script>
<script src="./app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消耗品ストック予測</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#3456c7">
  <meta name="description" content="在庫を数えずに、切らさず・買いすぎずに回す消耗品ストック予測">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ストック予測">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --c-primary: #3456c7;
      --c-soon:    #f59e0b;
      --c-overdue: #b42332;
      --c-ok:      #22c55e;
      --c-bg:      #f3f5fa;
      --c-card:    #ffffff;
      --c-border:  #e2e8f0;
      --c-text:    #1e293b;
      --c-muted:   #54627a;
      --radius:    12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── App shell ── */
    button { font-family: inherit; }
    :focus-visible { outline: 3px solid var(--c-primary); outline-offset: 3px; }
    .app-header {
      background: var(--c-card); border-bottom: 1px solid var(--c-border);
      padding-top: env(safe-area-inset-top);
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    nav, #main, .app-notice {
      width: min(100%, 960px);
      margin-inline: auto;
    }
    nav { display: flex; padding-inline: 14px; }
    .nav-tab {
      min-height: 46px;
      flex: 1;
      padding: 8px 4px;
      color: var(--c-muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 3px solid transparent;
      font-size: 0.9rem;
    }
    .nav-tab.active {
      color: var(--c-primary);
      border-bottom-color: var(--c-primary);
      font-weight: 700;
    }

    #main {
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .page-title { font-size: 1.5rem; line-height: 1.4; }
    .stock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr));
      gap: 12px;
    }
    @media (min-width: 720px) {
      .nav-tab { flex: 0 0 115px; }
    }
    @media (max-width: 380px) {
      #main { padding-inline: 12px; }
    }

    /* ── Card ── */
    .card {
      background: var(--c-card);
      border-radius: var(--radius);
      border: 1px solid var(--c-border);
      border-left: 4px solid var(--c-ok);
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .card.status-soon    { border-left-color: var(--c-soon); }
    .card.status-overdue { border-left-color: var(--c-overdue); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
    .badge-ok      { background: #dcfce7; color: #15803d; }
    .badge-soon    { background: #fef3c7; color: #92400e; }
    .badge-overdue { background: #fee2e2; color: #991b1b; }

    .card-stock {
      font-size: 1rem;
      margin-bottom: 4px;
    }
    .card-stock strong { color: var(--c-primary); }

    .card-body {
      font-size: 0.82rem;
      color: var(--c-muted);
      margin-bottom: 10px;
      min-height: 1.4em;
    }
    .runout-label { margin-right: 4px; }
    .runout { font-weight: 600; color: var(--c-text); }
    .range  { margin-left: 4px; font-size: 0.75rem; }
    .no-estimate { font-style: italic; }
    .learning-badge {
      display: inline-block;
      margin-left: 6px;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 99px;
      background: #e0e7ff;
      color: #3730a3;
    }

    /* ── Card actions ── */
    .card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; }
    .card-actions button, .btn-close { min-height: 44px; }
    .btn-close { min-width: 44px; }

    .btn-buy {
      flex: 1;
      background: var(--c-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 70px;
    }
    .btn-buy:active  { opacity: .8; }
    .btn-buy:disabled { background: #94a3b8; cursor: not-allowed; }

    .btn-open {
      flex: 1;
      background: #fff;
      color: var(--c-primary);
      border: 2px solid var(--c-primary);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 70px;
    }
    .btn-open:active   { opacity: .8; }
    .btn-open:disabled { border-color: #94a3b8; color: #94a3b8; cursor: not-allowed; }

    .btn-icon {
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--c-text);
      background: var(--c-border);
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-undo {
      font-size: 0.78rem;
      padding: 6px 10px;
      border: 1px solid var(--c-muted);
      border-radius: 8px;
      background: none;
      color: var(--c-muted);
      cursor: pointer;
      animation: fadein .2s;
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    /* ── Forms ── */
    form { display: flex; flex-direction: column; gap: 14px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; }
    input[type="text"],
    input[type="number"],
    input[type="time"] {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--c-border);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 400;
    }
    input:focus { border-color: var(--c-primary); }
    .req { color: var(--c-overdue); }
    .form-actions { display: flex; gap: 8px; }

    details { border: 1px solid var(--c-border); border-radius: 8px; padding: 10px 12px; }
    summary.detail-toggle {
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--c-muted);
      list-style: none;
    }
    summary.detail-toggle::before { content: "▶ "; font-size: 0.7rem; }
    details[open] summary.detail-toggle::before { content: "▼ "; }
    .detail-body { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }

    /* ── Buttons ── */
    .btn-primary {
      background: var(--c-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-ghost {
      background: none;
      border: 1px solid var(--c-border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--c-text);
    }
    .btn-danger {
      background: none;
      border: 1px solid var(--c-overdue);
      color: var(--c-overdue);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .data-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .data-actions label { font-weight: 400; flex-direction: row; align-items: center; font-size: 0.9rem; }

    .hint { font-size: 0.82rem; color: var(--c-muted); }
    .empty { text-align: center; padding: 40px 20px; color: var(--c-muted); }
    .empty p { margin-bottom: 16px; }

    hr { border: none; border-top: 1px solid var(--c-border); margin: 16px 0; }
    h3 { font-size: 0.95rem; margin-bottom: 8px; }

    /* ── Dialog ── */
    dialog {
      margin: auto;   /* 全体リセットの margin:0 で中央寄せが消えるのを戻す */
      max-height: 90dvh;
      border: none;
      border-radius: var(--radius);
      padding: 20px;
      width: min(400px, 95vw);
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .dialog-header h2 { font-size: 1rem; }
    .dialog-footer { display: flex; justify-content: flex-end; margin-top: 16px; }
    .recount-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .recount-row .hint { flex: 1; }
    .recount-row button { flex: none; }
    .choice-actions .btn-danger { width: 100%; }
    .archived-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .archived-list li {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border: 1px solid var(--c-border); border-radius: 10px; background: var(--c-card);
    }
    .archived-list .archived-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* ── Summary / banner ── */
    .summary { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 0.8rem; padding: 5px 12px; border-radius: 99px; border: none;
      font-weight: 600; font-family: inherit; cursor: default;
    }
    button.chip { cursor: pointer; }
    .chip-overdue { background: #fee2e2; color: #991b1b; }
    .chip-soon    { background: #fef3c7; color: #92400e; }
    .chip-ok      { background: #dcfce7; color: #15803d; }
    .chip-cost    { background: #e0e7ff; color: #3730a3; }
    .banner {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
      border-radius: var(--radius); padding: 10px 12px; font-size: 0.82rem;
    }
    .btn-small { padding: 5px 10px; font-size: 0.8rem; white-space: nowrap; background: #fff; }

    /* ── Card (jar) ── */
    .card-main { display: flex; gap: 12px; align-items: flex-start; }
    .card-content { flex: 1; min-width: 0; }
    .jar { width: 40px; height: 48px; flex-shrink: 0; margin-top: 2px; }
    .item-name {
      background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer;
      text-align: left; display: flex; align-items: center; gap: 6px; min-width: 0;
      font-weight: 700; overflow-wrap: anywhere;
    }
    .item-emoji { font-size: 1.15rem; line-height: 1; }
    .cost { margin-left: 6px; font-size: 0.75rem; color: #3730a3; }

    /* ── Emoji picker ── */
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 0.85rem; font-weight: 600; }
    .emoji-picker { display: flex; flex-wrap: wrap; gap: 4px; }
    .emoji-opt {
      min-width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--c-border);
      background: #fff; font-size: 1.2rem; cursor: pointer; padding: 0 6px;
    }
    .emoji-opt[data-emoji=""] { font-size: 0.75rem; color: var(--c-muted); }
    .emoji-opt.selected { border: 2px solid var(--c-primary); background: #eef2ff; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .row > label { flex: 1; min-width: 0; }

    /* ── Empty / settings ── */
    .empty-mascot { width: 88px; height: 88px; border-radius: 22px; margin-bottom: 12px;
                    box-shadow: 0 4px 14px rgba(79,127,255,.3); }
    .section { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .status-line { font-size: 0.85rem; }
    .status-line.warn { color: #92400e; }

    /* ── History ── */
    .history-stock { font-size: 0.9rem; margin-bottom: 12px; }
    .history-add {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px;
      background: var(--c-bg); border-radius: 8px; padding: 10px; margin-bottom: 12px;
    }
    .history-add label { font-size: 0.75rem; }
    .history-add .full { grid-column: 1 / -1; }
    .history-add input, .history-add select { width: 100%; min-width: 0; }
    .history-add select, .history-add input[type="datetime-local"] {
      padding: 8px 10px; border: 1px solid var(--c-border); border-radius: 8px;
      font-size: 0.9rem; background: #fff; font-family: inherit;
    }
    #history-list { list-style: none; max-height: 45vh; overflow-y: auto; }
    .history-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 2px;
      border-bottom: 1px solid var(--c-border); font-size: 0.85rem;
    }
    .history-text { flex: 1; }
    .history-text small { color: var(--c-muted); margin-left: 4px; }
    .history-date { color: var(--c-muted); font-size: 0.78rem; white-space: nowrap; }
    .btn-del { background: none; border: none; color: var(--c-muted); cursor: pointer; padding: 4px 6px; }
    .btn-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--c-muted); }
    /* ── Update notice ── */
    .app-notice {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
      background: #eef2ff; border-bottom: 1px solid #c7d2fe; color: #3730a3;
      padding: 10px 14px; font-size: 0.85rem;
    }
    .app-notice > span { align-self: center; }
    .app-notice ul { margin: 6px 0 0 1.2em; font-size: 0.8rem; }
    .btn-notice { background: var(--c-primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    .choice-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    #choice-message { font-size: 0.9rem; }

    /* ── 家計簿 ── */
    .exp-month { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 1.05rem; }
    .exp-month button:disabled { opacity: .35; cursor: default; }
    .exp-total-card {
      background: var(--c-card); border-radius: var(--radius); padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); display: flex; flex-direction: column; gap: 4px;
    }
    .exp-total-label { font-size: 0.8rem; color: var(--c-muted); }
    .exp-total { font-size: 1.6rem; font-weight: 700; }
    .exp-cats { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .exp-cat { display: grid; grid-template-columns: 6.5em 1fr auto; gap: 8px; align-items: center; font-size: 0.8rem; }
    .exp-cat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .exp-bar { height: 8px; background: var(--c-bg); border-radius: 99px; overflow: hidden; }
    .exp-bar > span { display: block; height: 100%; background: var(--c-primary); border-radius: 99px; }
    .exp-cat-val { font-variant-numeric: tabular-nums; }
    .exp-list { display: flex; flex-direction: column; gap: 6px; }
    .exp-day { font-size: 0.78rem; color: var(--c-muted); font-weight: 600; margin-top: 6px; }
    .exp-row {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      background: var(--c-card); border: 1px solid var(--c-border); border-radius: var(--radius);
      padding: 10px 12px; font: inherit; color: inherit; cursor: pointer;
    }
    .exp-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .exp-row-store { font-weight: 600; font-size: 0.92rem; }
    .exp-row-store small { font-weight: 400; color: var(--c-muted); margin-left: 6px; font-size: 0.75rem; }
    .exp-row-items { font-size: 0.78rem; color: var(--c-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .exp-row-total { font-weight: 700; font-variant-numeric: tabular-nums; }
    .exp-stock-badge { font-size: 0.72rem; background: #e0e7ff; color: #3730a3; border-radius: 99px; padding: 2px 7px; }
    .seg { display: flex; border: 1px solid var(--c-border); border-radius: 8px; overflow: hidden; }
    .seg-btn { flex: 1; padding: 9px 0; border: none; background: #fff; font: inherit; font-size: 0.88rem; cursor: pointer; color: var(--c-muted); }
    .seg-btn.active { background: var(--c-primary); color: #fff; font-weight: 600; }
    #exp-form select, .select {
      padding: 9px 10px; border: 1px solid var(--c-border); border-radius: 8px;
      font-size: 0.9rem; background: #fff; font-family: inherit; min-width: 0; font-weight: 400;
    }
    input[type="date"] {
      display: block; width: 100%; min-width: 0; max-width: 100%; padding: 10px 12px;
      border: 1px solid var(--c-border); border-radius: 8px; font-size: 1rem; font-family: inherit;
      background: #fff; font-weight: 400; color: var(--c-text);
      -webkit-appearance: none; appearance: none; height: calc(1.2em + 22px); line-height: 1.2;
    }
    input[type="date"]::-webkit-date-and-time-value { text-align: left; }
    .row > label > input { max-width: 100%; }
    #x-line-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .exp-line {
      border: 1px solid var(--c-border); border-left: 4px solid var(--c-border); border-radius: 8px;
      padding: 8px; display: flex; flex-direction: column; gap: 6px; background: #fff;
    }
    .exp-line.linked { border-left-color: var(--c-primary); background: #f5f8ff; }
    .exp-line-top { display: flex; gap: 6px; align-items: center; }
    .exp-line-top .l-name { flex: 1; }
    .exp-line-top .l-amount { width: 6.5em; flex: none; text-align: right; }
    .exp-line input[type="text"], .exp-line input[type="number"] { padding: 8px 10px; font-size: 0.95rem; }
    .exp-line-sub { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 0.8rem; }
    .exp-line-sub label { flex-direction: row; align-items: center; gap: 4px; font-weight: 400; font-size: 0.8rem; }
    .exp-line-sub .l-qty, .exp-line-sub .l-stock { width: 4.2em; padding: 6px 8px; font-size: 0.9rem; }
    .exp-line-sub select { padding: 6px 8px; font-size: 0.82rem; max-width: 100%; }
    .exp-line-sub .l-cat { width: 7.5em; }
    .exp-line-sub .l-item { flex: 1; min-width: 8em; }
    .l-stock-wrap { color: var(--c-primary); font-weight: 600 !important; }
    .exp-paste { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; align-items: flex-start; }
    .exp-paste textarea {
      width: 100%; border: 1px solid var(--c-border); border-radius: 8px; padding: 8px 10px;
      font: inherit; font-size: 0.9rem;
    }
    .exp-sum { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
    .exp-sum strong { font-size: 1.2rem; }
    .exp-receipt { flex-direction: row !important; align-items: center; gap: 6px !important; font-weight: 400 !important; font-size: 0.8rem !important; }
    .exp-receipt input { width: 7em; padding: 6px 8px; text-align: right; }
    #x-diff { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
    /* ── ホームのタイル・かんたん記録 ── */
    .tiles { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .tile {
      position: relative;
      background: var(--c-card); border: 1px solid var(--c-border);
      border-radius: var(--radius); padding: 16px;
      cursor: pointer; min-width: 0; font: inherit; color: inherit; text-align: left;
      display: flex; flex-direction: column; gap: 6px;
    }
    .tile:hover { border-color: var(--c-primary); }
    .tile-label { padding-right: 16px; }
    .tile-arrow { position: absolute; top: 16px; right: 12px; color: var(--c-primary); }
    .tile-stock { background: #edf1ff; border-color: #d5def9; }
    .tile:active { opacity: .85; }
    .tile-label { font-size: 0.78rem; color: var(--c-muted); font-weight: 600; }
    .tile-value { font-size: 1.3rem; font-weight: 700; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .tile-value.tile-overdue { color: var(--c-overdue); font-size: 1.05rem; }
    .tile-value.tile-soon    { color: #b45309; font-size: 1.05rem; }
    .tile-value.tile-ok      { color: #15803d; font-size: 1.05rem; }
    .tile-value.tile-muted   { color: var(--c-muted); font-size: 1.05rem; }
    .tile-sub { font-size: 0.75rem; color: var(--c-muted); }
    .alert-list { display: flex; flex-direction: column; gap: 6px; }
    .alert-row {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      background: #fff5f5; border: 1px solid #fecaca; border-left: 4px solid var(--c-overdue);
      border-radius: 10px; padding: 9px 12px; font: inherit; color: inherit; cursor: pointer;
    }
    .alert-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-weight: 600;
                  font-size: 0.9rem; overflow-wrap: anywhere; }
    .alert-stock { font-size: 0.75rem; color: var(--c-muted); overflow-wrap: anywhere; max-width: 40%; }
    .alert-days { font-size: 0.8rem; color: var(--c-overdue); font-weight: 700; white-space: nowrap; }
    .stock-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .stock-actions { display: flex; gap: 6px; }
    .stock-actions button, .section-head button { min-height: 44px; }
    .quick {
      background: var(--c-card); border: 1px solid var(--c-border);
      border-radius: var(--radius); padding: 16px; gap: 12px;
    }
    .quick-title { font-size: 1rem; font-weight: 700; }
    .quick-row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 6px; }
    .quick-row input { padding: 9px 10px; }
    .quick-cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .quick-cats::-webkit-scrollbar { display: none; }
    .qcat {
      flex: none; border: 1px solid var(--c-border); background: #fff; color: var(--c-text);
      border-radius: 99px; padding: 5px 12px; font: inherit; font-size: 0.8rem; cursor: pointer;
    }
    .qcat.selected { background: var(--c-primary); border-color: var(--c-primary); color: #fff; font-weight: 600; }
    .quick-stock { flex-direction: row !important; align-items: center; gap: 6px !important;
                   font-size: 0.8rem !important; color: var(--c-primary); }
    .quick-stock input { width: 16px; height: 16px; }
    .quick-actions { display: flex; gap: 8px; }
    .quick-actions .btn-primary { flex: 1; }
    .section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .section-head h2 { font-size: 1rem; }
    .home-alerts { display: grid; gap: 8px; }
    .toast-undo {
      background: none; border: 1px solid rgba(255,255,255,.5); color: #fff; border-radius: 8px;
      padding: 4px 10px; font: inherit; font-size: 0.8rem; cursor: pointer; white-space: nowrap;
    }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10;
      background: #1e293b; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 0.85rem;
      max-width: 92vw; box-shadow: 0 4px 16px rgba(0,0,0,.2); animation: fadein .2s;
      display: flex; align-items: center; gap: 10px;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1 class="visually-hidden">消耗品ストック予測</h1>

<nav aria-label="メイン">
  <button class="nav-tab active" data-view="home" aria-current="page">ホーム</button>
  <button class="nav-tab" data-view="stock">ストック</button>
  <button class="nav-tab" data-view="expenses">家計簿</button>
  <button class="nav-tab" data-view="settings">設定</button>
</nav>
</header>

<div id="app-notice" class="app-notice" hidden></div>

<main id="main">
  <div class="empty"><p>読み込み中…</p></div>
</main>

<!-- 編集ダイアログ -->
<dialog id="edit-dialog">
  <div class="dialog-header">
    <h2>品目を編集</h2>
    <button id="btn-close-edit" class="btn-close" aria-label="閉じる">✕</button>
  </div>
  <form id="edit-form">
    <label>品目名
      <input type="text" id="e-name" required>
    </label>
    <div class="field">
      <span class="field-label">アイコン</span>
      <div id="e-emoji-wrap"></div>
    </div>
    <label>登録時の在庫数
      <input type="number" id="e-stock" step="0.5" min="0">
    </label>
    <div class="recount-row">
      <p class="hint">在庫の数が合わないときは、いまの数を記録し直せます。</p>
      <button type="button" id="btn-recount" class="btn-ghost btn-small">🔢 在庫を数え直す</button>
    </div>
    <label>在庫の単位
      <input type="text" id="e-unit" placeholder="個">
    </label>
    <details>
      <summary class="detail-toggle">詳細設定（空欄で解除）</summary>
      <div class="detail-body">
        <div class="row">
          <label>1つあたりの量
            <input type="number" id="e-qty" step="0.1" min="0.1">
          </label>
          <label>量の単位
            <input type="text" id="e-punit" placeholder="例: ml">
          </label>
        </div>
        <label id="e-prior-label">初期消費ペース申告（日）
          <input type="number" id="e-prior" step="1" min="1">
          <span class="hint">空欄にすると解除され、「使用開始」の記録だけで予測します。</span>
        </label>
        <label>単価（円・1つあたり）
          <input type="number" id="e-price" step="1" min="0">
        </label>
      </div>
    </details>
    <div class="form-actions">
      <button type="submit" class="btn-primary">保存</button>
      <button type="button" id="btn-edit-history" class="btn-ghost">📜 履歴</button>
    </div>
  </form>
  <div class="dialog-footer">
    <button id="btn-archive" class="btn-danger">管理をやめる・削除…</button>
  </div>
</dialog>

<!-- 履歴ダイアログ -->
<dialog id="history-dialog">
  <div class="dialog-header">
    <h2 id="history-title">履歴</h2>
    <button id="btn-close-history" class="btn-close" aria-label="閉じる">✕</button>
  </div>
  <div id="history-stock" class="history-stock"></div>
  <form id="history-form" class="history-add">
    <label>記録の種類
      <select id="h-type">
        <option value="purchase">🛒 買った</option>
        <option value="opening">📂 使用開始</option>
        <option value="adjust">🔢 在庫を数え直す</option>
      </select>
    </label>
    <label id="h-qty-label"><span>個数</span>
      <input type="number" id="h-qty" step="0.5" min="0.5" value="1">
    </label>
    <label class="full">日時
      <input type="datetime-local" id="h-at">
    </label>
    <button type="submit" class="btn-primary full">記録を追加</button>
  </form>
  <ul id="history-list"></ul>
</dialog>

<!-- 選択ダイアログ -->
<dialog id="choice-dialog">
  <h2 id="choice-title" style="font-size:1rem;margin-bottom:8px"></h2>
  <p id="choice-message"></p>
  <div class="choice-actions"></div>
</dialog>

<script src="./version.js"></script>
<script src="./db.js"></script>
<script src="./forecast.js"></script>
<script src="./app.js"></script>
<script src="./expenses.js"></script>
</body>
</html>

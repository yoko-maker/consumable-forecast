[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consumable-forecast"
version = "0.1.0"
description = "消耗品ストック予測ツール — 在庫を数えずに切らさない"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[project.scripts]
consumable-forecast = "app.main:run"
